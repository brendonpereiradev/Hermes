name: Public data checks

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Check public source and history
        shell: pwsh
        run: |
          python scripts/Test-PublicData.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/Test-PublicData.py --history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check secrets
        shell: pwsh
        run: ./scripts/Test-Secrets.ps1
