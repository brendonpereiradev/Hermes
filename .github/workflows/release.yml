name: Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão (ex: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: windows-latest
    permissions:
      contents: read
      # Token OIDC de curta duração para o login no Azure Artifact Signing.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Verify public source and history
        env:
          REQUESTED_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}
        shell: pwsh
        run: |
          if ($env:REQUESTED_RELEASE_TAG) {
            [xml]$props = Get-Content 'Directory.Build.props'
            $version = @($props.Project.PropertyGroup.Version | Where-Object { $_ })[0]
            if ($env:REQUESTED_RELEASE_TAG -ne "v$version") {
              throw 'A tag solicitada deve corresponder à versão do aplicativo.'
            }
          }
          python scripts/Test-PublicData.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/Test-PublicData.py --history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Test-Secrets.ps1

      - name: Restore dependencies
        run: dotnet restore PrinterInstall.sln

      - name: Run automated tests
        run: dotnet test PrinterInstall.sln --configuration Release --no-restore --verbosity normal

      - name: Build and package single-file executable
        shell: powershell
        run: |
          .\scripts\Publish-PrinterInstall.ps1 -Configuration Release

      # Configuração em Settings > Secrets and variables > Actions:
      #   secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (credencial federada para este repositório);
      #   variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE.
      - name: Azure login
        if: vars.AZURE_SIGNING_ENDPOINT != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign executable
        if: vars.AZURE_SIGNING_ENDPOINT != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\publish\PrinterInstall\Printer Install.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
        run: |
          $signature = Get-AuthenticodeSignature -FilePath 'publish\PrinterInstall\Printer Install.exe'
          if ($env:SIGNING_CONFIGURED -eq 'true') {
            if ($signature.Status -ne 'Valid') {
              throw "Assinatura inválida: $($signature.Status) $($signature.StatusMessage)"
            }
            Write-Host "Assinado por: $($signature.SignerCertificate.Subject)"
          } else {
            Write-Host '::warning::Assinatura de código não configurada; o executável será publicado sem assinatura.'
          }

      - name: Verify published executable
        shell: powershell
        run: |
          $exePath = "publish\PrinterInstall\Printer Install.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "O executável '$exePath' não foi encontrado após o build."
            exit 1
          }
          $size = (Get-Item $exePath).Length / 1MB
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          Write-Host "Executável gerado com sucesso: $exePath"
          Write-Host "Tamanho: $([math]::Round($size, 2)) MB"
          Write-Host "SHA256: $hash"
          "$hash  Printer.Install.exe" | Out-File -FilePath "publish\PrinterInstall\checksums-sha256.txt" -Encoding utf8

      - name: Check executable before upload
        shell: pwsh
        run: |
          python scripts/Test-PublicData.py --artifact 'publish/PrinterInstall/Printer Install.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Test-Secrets.ps1 -ArtifactPath 'publish/PrinterInstall'

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            publish/PrinterInstall/Printer Install.exe
            publish/PrinterInstall/checksums-sha256.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
    runs-on: ubuntu-latest
    # Só este job, sem checkout nem build, recebe permissão de escrita.
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release-files

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            release-files/Printer Install.exe
            release-files/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
